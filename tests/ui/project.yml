name: MaesterUITests
options:
  deploymentTarget:
    macOS: "15.0"
targets:
  MaesterUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - PanelFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kishore.maester.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
schemes:
  MaesterUITests:
    build:
      targets:
        MaesterUITests: [test]
    test:
      targets:
        - MaesterUITests
