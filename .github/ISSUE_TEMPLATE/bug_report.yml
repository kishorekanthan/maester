name: Bug report
description: Something in Maester itself is wrong.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected instead, and what you saw.
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.0
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: e.g. MacBook Pro 14-inch, M3
    validations:
      required: true
  - type: input
    id: maester-version
    attributes:
      label: Maester version
      placeholder: e.g. v0.1.0, or a commit hash if built from source
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider involved, if any
      placeholder: e.g. mac, apps, or the name of a third-party provider
    validations:
      required: false
  - type: textarea
    id: doctor-output
    attributes:
      label: maester-doctor output
      description: Run `maester-doctor` and paste the full output.
      render: text
    validations:
      required: true
